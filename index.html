<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CyberSafe - URL Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🛡️ CyberSafe</h1>

        <p>
            Check a URL for basic suspicious signs.
        </p>

        <div class="checker">

            <input
                type="text"
                id="urlInput"
                placeholder="Enter URL here..."
            >

            <button onclick="checkURL()">
                Check URL
            </button>

        </div>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
